name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  parity:
    name: Parity against the original engine
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # No dependencies to install — the engine is plain ES modules and the
      # suite runs on node's built-in test runner.
      - name: Run the parity suite
        run: npm test

      # Separate from the parity suite on purpose: that suite's count is the
      # contract with the original engine, and a web server does not belong in
      # it. It still has to pass.
      - name: Check the development server
        run: npm run test:serve

      # Same reasoning: browser storage was never part of the original, but a
      # Clear saved data button that leaves a key behind reinstates the stuck
      # document it exists to remove.
      - name: Check the stored state and the clear
        run: npm run test:store

      # The operation packs. Merging rests on Extras staying disjoint from the
      # shipped table, and on appending never renumbering a row the user has --
      # ordinals decide which anchor an X1+ operation binds to.
      - name: Check the operation packs and the merge
        run: npm run test:packs

      # The optional tags from the author's later documents. Not in the parity
      # count -- the original never ran them -- but they must prove they label
      # rows without moving a score or a rank.
      - name: Check the optional tags
        run: npm run test:tags

      # Protocol Prime and the SOP: advice and a reading view. Must never block
      # a cast, and the objective default must leave every .oph byte-identical.
      - name: Check Protocol Prime and the SOP warnings
        run: npm run test:sop

      # start.html, the guided first run. Not in the parity count -- the original
      # had no such page -- but it must prove it only reads the engine: every
      # date and score it shows is a row runOphis produced.
      - name: Check the Start here reading
        run: npm run test:start

      # The Lab: readings from the author's later notes (docs/reverse/24). Not in
      # the parity count -- the original never ran them -- but they must prove
      # they read a run without moving a score, a hit count, a rank or a row.
      - name: Check the Lab readings
        run: npm run test:lab

      - name: Check nothing reaches for eval
        run: |
          if grep -rnE '\bnew Function\b|\beval\(' src/ --include='*.js' \
             | grep -vE '^\s*src/core/equation/(parser|index)\.js:[0-9]+:\s*\*'; then
            echo "::error::found a dynamic code-evaluation sink in src/ — see docs/DEVIATIONS.md"
            exit 1
          fi
          echo "no eval / new Function in src/"

      - name: Check nothing sets innerHTML
        run: |
          if grep -rnE 'innerHTML|outerHTML|insertAdjacentHTML|document\.write' src/ --include='*.js' \
             | grep -vE ':\s*(\*|//)'; then
            echo "::error::found a markup sink in src/ — user text must go in as a text node"
            exit 1
          fi
          echo "no markup sinks in src/"

      # The single-file build is generated from index.html and src/. Two
      # hand-made copies had already drifted apart and kept a fixed defect
      # alive; this fails the build rather than letting it happen again.
      - name: Check the single-file build is not stale
        run: |
          npm ci
          npm run bundle:check
